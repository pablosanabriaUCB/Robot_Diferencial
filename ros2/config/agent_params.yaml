# micro-ROS Agent Configuration
# ==============================
# Parameters for the micro-ROS agent Docker container.

agent:
  transport: udp4
  port: 8888
  verbose: 6
  docker_image: "microros/micro-ros-agent:jazzy"

# WiFi network (must match ESP32 firmware config)
network:
  ssid: "OnLineHS"
  agent_ip: "10.0.1.154"
